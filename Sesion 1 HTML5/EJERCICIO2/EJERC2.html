<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>

<body>

    <h1>Formulario de Registro</h1>

    <form action="/registro" method="post">

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" 
                   required 
                   minlength="2"
                   maxlength="30"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                   title="Ingrese un nombre válido">
        </p>

        <p>
            <label for="primer_apellido">Primer apellido:</label>
            <input type="text" id="primer_apellido" name="primer_apellido"
                   required
                   minlength="2"
                   maxlength="30"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                   title="Ingrese un primer apellido válido">
        </p>

        <p>
            <label for="segundo_apellido">Segundo apellido:</label>
            <input type="text" id="segundo_apellido" name="segundo_apellido"
                   required
                   minlength="2"
                   maxlength="30"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                   title="Ingrese un segundo apellido válido">
        </p>

        <p>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo"
                   required
                   maxlength="100"
                   title="Ingrese un correo electrónico válido">
        </p>

        <p>
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena"
                   required
                   minlength="8"
                   maxlength="20"
                   title="La contraseña debe tener entre 8 y 20 caracteres">
        </p>

        <p>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"
                   required
                   minlength="9"
                   maxlength="9"
                   pattern="[0-9]{9}"
                   title="Ingrese un teléfono de 9 dígitos">
        </p>

        <p>
            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha">
        </p>

        <p>
            <button type="submit">Registrarse</button>
        </p>

    </form>

</body>

</html>
